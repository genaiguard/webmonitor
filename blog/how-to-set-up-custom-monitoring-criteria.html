"natural language","custom monitoring","ai","automation","data analysis"],"featured":false,"slug":"how-to-set-up-custom-monitoring-criteria","body":{"raw":"\n## Introduction: The Power of Plain English\n\nOne of the most powerful features of WebMonitor.fyi is the ability to define your monitoring criteria using natural language. Instead of wrestling with complex code like CSS selectors or XPath, you can simply tell our AI what to look for in plain English. This guide will walk you through how to set up effective custom monitoring criteria, from basic examples to advanced techniques.\n\n## Why Use Natural Language for Monitoring?\n\nThe ability to use natural language for queries is a significant leap forward in data analysis and monitoring. As explained in this [in-depth article from Alation](https://www.alation.com/blog/natural-language-query-nlq/), this approach democratizes data access, allowing non-technical users to get the information they need without relying on developers. This means anyone on your team can set up a monitor to track what matters most to them.\n\n## How to Set Up Your First Custom Monitor\n\nSetting up a monitor is a straightforward, three-step process:\n\n1.  **Enter the URL:** Start by pasting the URL of the page you want to monitor into the \"Add New Monitor\" form.\n2.  **Write Your Criteria:** This is where the magic happens. In the criteria box, write a clear, concise instruction for our AI. We'll cover examples in the next section.\n3.  **Set Frequency and Alerts:** Choose how often you want us to check the page and how you want to be notified (email, SMS, etc.).\n\n## Examples of Custom Monitoring Criteria\n\nHere are some examples to give you a sense of what's possible:\n\n### Basic Examples\n\n-   **Price Tracking:** *\"Notify me when the price drops below $500.\"*\n-   **Stock Monitoring:** *\"Alert me if the product is back in stock.\"*\n-   **Keyword Spotting:** *\"Inform me if the phrase 'data breach' appears on this page.\"*\n\n### Advanced Examples\n\n-   **Sentiment Analysis:** *\"Alert me if there are any new negative reviews about our product.\"*\n-   **Job Postings:** *\"Let me know when a new job posting for a 'Software Engineer' is published.\"*\n-   **Combining Criteria:** *\"Notify me if the price of the 4K TV is below $1000 AND it is in stock.\"*\n\nFor more ideas, check out our article on the [top use cases for web content monitoring](/blog/top-use-cases-for-web-content-monitoring).\n\n## Best Practices for Writing Effective Criteria\n\nTo get the best results from our AI, follow these best practices:\n\n-   **Be Specific:** The more specific your query, the more accurate the result. Instead of *\"Tell me about changes,\"* write *\"Notify me if the 'Features' section of this page is updated.\"*\n-   **Use Quotes for Exact Phrases:** If you are looking for an exact phrase, enclose it in quotes. For example: *\"Alert me if the text 'Terms and Conditions have been updated' is present.\"*\n-   **Keep it Simple:** While our AI is powerful, it's best to start with simple, direct instructions. You can always refine your criteria later.\n\n## Conclusion: Your Words, Your Data\n\nSetting up custom monitoring criteria with natural language empowers you to track the web in a way that was never before possible. It puts the power of AI-driven analysis at your fingertips, allowing you to stay informed and make better decisions. By following the best practices in this guide, you can create powerful, precise monitors that deliver the insights you need, when you need them.\n","code":"var Component=(()=\u003e{var u=Object.create;var o=Object.defineProperty;var d=Object.getOwnPropertyDescriptor;var m=Object.getOwnPropertyNames;var g=Object.getPrototypeOf,p=Object.prototype.hasOwnProperty;var f=(n,e)=\u003e()=\u003e(e||n((e={exports:{}}).exports,e),e.exports),w=(n,e)=\u003e{for(var i in e)o(n,i,{get:e[i],enumerable:!0})},s=(n,e,i,a)=\u003e{if(e\u0026\u0026typeof e==\"object\"||typeof e==\"function
