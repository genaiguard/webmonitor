ic/chunks/pages/blog/%5Bslug%5D-76711573db7f3ffb.js" defer=""></script><script src="/_next/static/NT2lJRAEAa_YRqT0p8iIS/_buildManifest.js" defer=""></script><script src="/_next/static/NT2lJRAEAa_YRqT0p8iIS/_ssgManifest.js" defer=""></script></head><body><div id="__next"><div class="dark __variable_8b3a0b __className_8b3a0b min-h-screen bg-background text-foreground antialiased"><div class="flex h-screen w-full items-center justify-center bg-background"><div class="flex items-center gap-3 text-sm text-muted-foreground"><span class="inline-block h-2 w-2 animate-pulse rounded-full bg-primary"></span><span class="inline-block h-2 w-2 animate-pulse rounded-full bg-primary [animation-delay:150ms]"></span><span class="inline-block h-2 w-2 animate-pulse rounded-full bg-primary [animation-delay:300ms]"></span></div></div><section aria-label="Notifications alt+T" tabindex="-1" aria-live="polite" aria-relevant="additions text" aria-atomic="false"></section></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"post":{"title":"A Guide to Custom Monitoring Criteria with Natural Language","description":"Learn how to set up powerful, custom monitoring criteria using natural language queries with WebMonitor.fyi. This guide covers best practices and advanced examples.","date":"2024-01-30T00:00:00.000Z","author":"Michael Smith","readTime":"11","tags":["natural language","custom monitoring","ai","automation","data analysis"],"featured":false,"slug":"how-to-set-up-custom-monitoring-criteria","body":{"raw":"\n## Why Plain English Beats CSS Selectors for Monitoring\n\nSetting up a traditional web monitor used to mean picking a CSS selector, hoping the class name didn't change, and writing a script to compare the result week over week. The first time the site's front-end team renamed `.price-tag` to `.product__price`, the monitor went silent without telling you. **WebMonitor.fyi** lets you describe what you want to track in plain English instead — and the AI handles the rest, even when the underlying HTML changes. This guide covers how to write good natural-language monitoring criteria, from basic patterns to combined-condition rules.\n\n## Why Natural Language Criteria Work\n\nThe case for natural-language queries is covered in this [in-depth article from Alation](https://www.alation.com/blog/natural-language-query-nlq/). Three operational gains for monitoring specifically:\n\n-   **No technical setup.** Describe what you want to track in a sentence. No selectors, no scripts, no maintenance when the site's markup churns.\n-   **Resilience to markup changes.** The AI reads the page semantically. When a site refactors its CSS or moves a price into a new component, the monitor keeps working.\n-   **Accessibility across the team.** Anyone — not just developers — can set up a monitor that catches what matters to their work.\n\nWhat natural-language criteria don't fix: vague criteria still produce vague alerts. \"Tell me when something changes\" matches everything. The work moved from selector-writing to criterion-writing.\n\n## How to Set Up Your First Custom Monitor\n\nThree steps from URL to active monitor:\n\n1.  **Enter the URL.** Paste the page URL into the \"Add New Monitor\" form.\n2.  **Write your criteria.** Describe in plain English what you want the AI to watch for. Examples in the next section.\n3.  **Set frequency and alerts.** Pick the polling cadence and notification channels (email, SMS, webhook).\n\n## Examples of Custom Monitoring Criteria\n\n### Basic Examples\n\n-   **Price tracking:** *\"Notify me when the price drops below $500.\"*\n-   **Stock monitoring:** *\"Alert me if the product is back in stock.\"*\n-   **Keyword spotting:** *\"Inform me if the phrase 'data breach' appears on this page.\"*\n\n### Advanced Examples\n\n-   **Sentiment analysis:** *\"Alert me if there are any new negative reviews about our product.\"*\n-   **Job postings:** *\"Let me know when a new job posting for a 'Software Engineer' is published.\"*\n-   **Combining criteria:** *\"Notify me if the price of the 4K TV is below $1000 AND it is in stock.\"*\n\nFor more applications, see our article on the [top use cases for web content monitoring](/blog/top-use-cases-for-web-content-monitoring).\n\n## Best Practices for Writing Effective Criteria\n\nThree rules that produce reliable monitors:\n\n-   **Be specific.** \"Notify me if the 'Features' section of this page is updated\" beats \"tell me about changes.\"\n-   **Use quotes for exact phrases.** \"Alert me if the text 'Terms and Conditions have been updated' is present\" — quotes anchor the AI on the exact string.\n-   **Start simple, then refine.** A direct one-condition criterion is the right starting point. Combine conditions later once you see what the monitor catches and misses.\n\n## Set Up Your First Custom Monitor\n\nNatural-language criteria put precise monitoring within reach of anyone on your team. WebMonitor.fyi handles the AI interpretation and page polling so you can describe what matters in a sentence and walk away. [Sign up for a free account](/auth/signup) and run your first custom monitor in under 5 minutes. The [pricing](/pricing) page lists paid plans by check frequency and monitor count.\n","code":"var Component=(()=\u003e{var d=Object.create;var o=Object.defineProperty;var u=Object.getOwnPropertyDescriptor;var g=Object.getOwnPropertyNames;var m=Object.getPrototypeOf,p=Object.prototype.hasOwnProperty;var f=(t,e)=\u003e()=\u003e(e||t((e={exports:{}}).exports,e),e.exports),w=(t,e)=\u003e{for(var i in e)o(t,i,{get:e[i],enumerable:!0})},c=(t,e,i,a)=\u003e{if(e\u0026\u0026typeof e==\"object\"||typeof e==\"function\")for(let r of g(e))!p.call(t,r)\u0026\u0026r!==i\u0026\u0026o(t,r,{get:()=\u003ee[r],enumerable:!(a=u(e,r))||a.enumerable});return t};var y=(t,e,i)=\u003e(i=t!=null?d(m(t)):{},c(e||!t||!t.__esModule?o(i,\"default\",{value:t,enumerable:!0}):i,t)),b=t=\u003ec(o({},\"__esModule\",{value:!0}),t);var h=f((C,s)=\u00
